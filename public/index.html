<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Triage Board</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" defer></script>
</head>
<body>
<div class="wrap">
  <header class="head">
    <div class="toprow">
      <p class="kicker" id="kicker">Priority triage · saved locally</p>
      <div class="who" id="who" hidden>
        <img id="whoAvatar" alt="" width="22" height="22">
        <a id="whoRepo" target="_blank" rel="noopener"></a>
        <form method="post" action="/auth/logout"><button class="mini" type="submit">Sign out</button></form>
      </div>
    </div>
    <h1>Triage Board</h1>
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="board" aria-selected="true">Board</button>
      <button role="tab" data-tab="snippets" aria-selected="false">Snippets</button>
    </nav>
    <div class="prog" id="progRow">
      <div class="progbar"><i id="barFill"></i></div>
      <div class="progtxt"><b id="doneN">0</b> of <b id="totN">0</b> done · <span id="leftN">0</span> left</div>
    </div>
  </header>

  <!-- Sign-in / first-run setup (GitHub mode) -->
  <section class="gate" id="gate" hidden></section>

  <div id="boardView">
  <div class="controls">
    <div class="controls-in">
      <!-- Row 1: projects -->
      <div class="row">
        <span class="rowlab">Project</span>
        <div class="seg-row" id="projFilters"><!-- chips injected --></div>
        <button class="mini" id="manageProj" title="Add or remove projects">⚙ Projects</button>
      </div>
      <!-- Row 2: status -->
      <div class="row">
        <span class="rowlab">Status</span>
        <div class="seg-row" id="stateFilters">
          <button class="f" data-k="view" data-v="all" aria-pressed="true">All</button>
          <button class="f" data-k="view" data-v="open" aria-pressed="false">Not done</button>
          <button class="f" data-k="view" data-v="done" aria-pressed="false">Done</button>
          <button class="f" data-k="view" data-v="blocked" aria-pressed="false">Blocked</button>
        </div>
        <span class="grow"></span>
        <button class="addbtn" id="addBtn">+ Add item</button>
      </div>
    </div>
  </div>

  <main id="board"><p class="empty">Loading…</p></main>
  </div>

  <div id="snippetsView" hidden>
    <div class="controls">
      <div class="controls-in">
        <div class="row">
          <input class="search" id="snipSearch" type="search" placeholder="Search snippets…  (press / )" autocomplete="off" aria-label="Search snippets">
          <button class="addbtn" id="snipAdd">+ New snippet</button>
        </div>
        <div class="row">
          <span class="rowlab">Tags</span>
          <div class="seg-row" id="tagFilters"></div>
        </div>
      </div>
    </div>
    <main id="snips"><p class="empty">Loading…</p></main>
  </div>
</div>

<!-- Add / edit item modal -->
<div class="modal-bg" id="modalBg">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h2 id="mTitle">New item</h2>
    <p class="merr" id="mErr"></p>
    <div class="fld"><label for="mTitleIn">Title</label><input id="mTitleIn" placeholder="What needs doing?" maxlength="200"></div>
    <div class="frow">
      <div class="fld"><label for="mProj">Project</label><select id="mProj"></select></div>
      <div class="fld"><label for="mPrio">Priority</label>
        <select id="mPrio">
          <option value="critical">Critical</option>
          <option value="high">High</option>
          <option value="medium" selected>Medium</option>
          <option value="low">Low</option>
        </select>
      </div>
    </div>
    <div class="fld"><label for="mGroup">Group / area <span class="opt">(optional)</span></label><input id="mGroup" list="groupList" placeholder="e.g. Books, Analytics, Truck" maxlength="80"><datalist id="groupList"></datalist></div>
    <div class="fld"><label for="mNote">Note <span class="opt">(optional)</span></label><textarea id="mNote" placeholder="Any detail you want on the card" maxlength="800"></textarea></div>
    <div class="macts">
      <button class="mbtn" id="mCancel">Cancel</button>
      <button class="mbtn primary" id="mSave">Add to board</button>
    </div>
  </div>
</div>

<!-- Manage projects modal -->
<div class="modal-bg" id="projBg">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="pTitle">
    <h2 id="pTitle">Your projects</h2>
    <p class="psub">These show up in the Project filter and in the dropdown when you add an item.</p>
    <ul class="plist" id="plist"></ul>
    <p class="merr" id="pErr"></p>
    <div class="fld addproj">
      <label for="pNewIn">Add a project</label>
      <div class="frow">
        <input id="pNewIn" placeholder="e.g. Acme Rollout" maxlength="80">
        <button class="mbtn primary" id="pAdd" style="flex:none">Add</button>
      </div>
    </div>
    <div class="macts"><button class="mbtn" id="pClose">Done</button></div>
  </div>
</div>

<!-- Add / edit snippet modal -->
<div class="modal-bg" id="snipBg">
  <div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="sTitle">
    <h2 id="sTitle">New snippet</h2>
    <p class="merr" id="sErr"></p>
    <div class="fld"><label for="sTitleIn">Title</label><input id="sTitleIn" placeholder="e.g. Books API: create invoice" maxlength="120"></div>
    <div class="frow">
      <div class="fld"><label for="sLang">Language</label>
        <select id="sLang">
          <option value="deluge">Deluge</option>
          <option value="javascript">JavaScript</option>
          <option value="json">JSON</option>
          <option value="sql">SQL</option>
          <option value="python">Python</option>
          <option value="html">HTML</option>
          <option value="css">CSS</option>
          <option value="bash">Shell</option>
          <option value="plaintext">Plain text</option>
        </select>
      </div>
      <div class="fld"><label for="sTags">Tags <span class="opt">(comma separated)</span></label><input id="sTags" list="tagList" placeholder="books, api, dates"><datalist id="tagList"></datalist></div>
    </div>
    <div class="fld"><label for="sDesc">Description <span class="opt">(optional)</span></label><textarea id="sDesc" placeholder="When to use it, gotchas, which clients" maxlength="4000"></textarea></div>
    <div class="fld"><label for="sCode">Code</label><textarea id="sCode" class="code-in" spellcheck="false" placeholder="Paste the snippet here"></textarea></div>
    <div class="macts">
      <button class="mbtn" id="sCancel">Cancel</button>
      <button class="mbtn primary" id="sSave">Save snippet</button>
    </div>
  </div>
</div>

<script src="app.js" defer></script>
</body>
</html>
